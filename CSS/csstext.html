<!DOCTYPE html>
<html>
    <meta charset="utf-8">
    <title>CSS Basics</title>

    <style>
        .textcolor{
            color:red;
        }
        .textcolor2{
            color: #10c212;
        }
        .textcolor3{
            color: rgb(160,50,90);
        }
        .textspace{
            letter-spacing: 10px;
        }
        .wordspace{
            word-spacing: 10px;
        }
        .textalign{
            text-align: center;
        }
        .textdecor{
            text-decoration: underline;
        }
        .texttransform{
            text-transform: capitalize;
        }
        .textstyle{
            font-family: verdana, sans-serif;
            font-size: large;
            font-style: oblique;
            line-height: 200%;
        }
        .myborder{
            border: 4px;
            border-color: #333333;
            border-style: dashed;
        }
    </style>

    <body>
        <div>
            <p class="textcolor myborder"> This is sample text.</p>
        </div>
        <div>
            <p class="textcolor2"> This is sample text.</p>
        </div>
        <div>
            <p class="textcolor3"> This is sample text.</p>
        </div>
        <div>
            <p class="textspace"> This is sample text.</p>
        </div>
        <div>
            <p class="wordspace"> This is sample text.</p>
        </div>
        <div>
            <p class="textalign"> This is sample text.</p>
        </div>
        <div>
            <p class="textdecor"> This is sample text.</p>
        </div>
        <div>
            <p class="texttransform"> This is sample text.</p>
        </div>
        <div>
            <p class="textstyle"> This is sample text.</p>
        </div>
        <div>
            <p class="myborder"> This is sample text.</p>
        </div>
        
    </body>

</html>
