<!DOCTYPE html>

<html>

    <head>  
        <meta charset="utf-8">
        <title>CSS Basics</title>

        <style type="text/css">
            Body {
                Background: pink;
                font-family: Arial;
            }

            h1, h2, h3, h4 {
                font-family: Georgia;
                color: red;
            }

            .blueboldtext{
                font-size: small;
                color: blue;
                font-weight: bold;
            }
            .largegreentext{
                font-size: large;
                color: green;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <table width="600" border="0" cellspacing="1" cellpadding="1">
            <tr>
                <td><h1>Heading 1</h1></td>
            </tr>
            <tr>
                <td class="blueboldtext">
                    This is <span class="largegreentext">example</span> text.
                </td>
            </tr>
            <tr><td>&nbsp;</td></tr>
            <tr>
                <td><h2>Heading 2</h2></td>
            </tr>
            <tr>
                <td class="largegreentext">
                    This is example text.
                </td>
            </tr>
            <tr>
                <td><h3>Heading 3</h3></td>
            </tr>
            <tr>
                <td class="blueboldtext">
                    This is example text.
                </td>
            </tr>
            <tr><td>&nbsp;</td></tr>
        </table>
    </body>


</html>
